name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * 1 1"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup git user
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache astronomy data
        uses: actions/cache@v4
        with:
          path: .astro_cache
          key: astro-data-v1
      - name: Update
        if: github.event_name != 'pull_request'
        run: |
          python ./update.py
          python ./astro_update.py
          git add .
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Update Calendar Regularly (GitHub Actions)"
          git push origin main
