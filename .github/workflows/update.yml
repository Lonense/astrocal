name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * 1 1"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: Setup git user
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Install dependencies
        run: uv sync
      - name: Cache astronomy data
        uses: actions/cache@v5
        with:
          path: .astro_cache
          key: astro-data-v1
      - name: Update
        if: github.event_name != 'pull_request'
        run: |
          uv run python ./update.py
          uv run python ./astro_update.py
          git add .
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Update Calendar Regularly (GitHub Actions)"
          git push origin main
